services:
  furnace-desk:
    build: .
    container_name: furnace-desk
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      DATABASE_PATH: /data/service.sqlite3
    volumes:
      - furnace-data:/data

volumes:
  furnace-data:
